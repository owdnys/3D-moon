<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#03060d">
<meta name="description" content="可交互的地月系统：地球与月球同处一片星空，点击切换视角，支持拖动旋转、滚轮缩放与移动端。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='22' cy='32' r='14' fill='%235aa9e6'/%3E%3Ccircle cx='46' cy='30' r='7' fill='%23dfe6f0'/%3E%3C/svg%3E">
<title>地月系统 · Earth &amp; Moon</title>
<style>
  :root{
    --glass-bg: rgba(10,16,30,.44);
    --glass-bd: rgba(255,255,255,.14);
    --ink: #e8eefc;
    --ink-dim: #93a4c4;
    --accent: #57b6ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#03060d}
  body{
    font:14px/1.5 "PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    user-select:none;
  }
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #gl.dragging{cursor:grabbing}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}

  .glass{
    background:var(--glass-bg);
    border:1px solid var(--glass-bd);
    border-radius:16px;
    backdrop-filter:blur(18px) saturate(150%);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    box-shadow:0 10px 34px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.09);
  }

  /* ---------- 标题 ---------- */
  #title{
    position:fixed;left:20px;top:20px;padding:12px 18px 13px;
    pointer-events:none;
    opacity:0;transform:translateY(-8px);
    transition:opacity .7s ease .15s, transform .7s ease .15s;
  }
  #title.on{opacity:1;transform:none}
  #title h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.5px}
  #title p{margin:3px 0 0;font-size:12px;color:var(--ink-dim);letter-spacing:.3px}

  /* ---------- 工具栏 ---------- */
  #toolbar{
    position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);
    display:flex;align-items:center;gap:6px;padding:7px;
    opacity:0;transition:opacity .7s ease .3s, transform .7s ease .3s;
    z-index:5;
    max-width:calc(100vw - 24px);
  }
  #toolbar.on{opacity:1;transform:translate(-50%,0)}

  .seg{display:flex;background:rgba(255,255,255,.06);border-radius:9px;padding:2px;gap:2px;flex:none}
  .seg button{
    appearance:none;border:0;background:transparent;color:var(--ink-dim);
    font:inherit;font-size:12px;line-height:1;
    padding:7px 11px;border-radius:7px;cursor:pointer;
    transition:background .18s,color .18s;
  }
  .seg button.active{background:rgba(87,182,255,.22);color:#d3ebff}
  .seg button:hover{color:var(--ink)}

  .btn{
    appearance:none;border:0;background:transparent;color:var(--ink-dim);
    font:inherit;font-size:12.5px;line-height:1;
    padding:9px 13px;border-radius:11px;cursor:pointer;
    display:flex;align-items:center;gap:7px;white-space:nowrap;flex:none;
    transition:background .18s,color .18s,transform .12s;
  }
  .btn:hover{background:rgba(255,255,255,.08);color:var(--ink)}
  .btn:active{transform:scale(.96)}
  .btn svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;
           stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .btn[aria-pressed="true"]{background:rgba(87,182,255,.17);color:#bfe0ff}
  .btn[aria-pressed="true"] .dot{background:var(--accent);box-shadow:0 0 7px var(--accent)}
  .dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.26);
       flex:none;transition:background .18s,box-shadow .18s}
  .sep{width:1px;height:24px;flex:none;background:rgba(255,255,255,.12);margin:0 2px}

  /* 只在聚焦月球时显示：标注 / 月相 */
  .moon-only{
    overflow:hidden;white-space:nowrap;
    transition:opacity .22s ease, max-width .22s ease, padding .22s ease, margin .22s ease;
  }
  #toolbar:not([data-focus="moon"]) .moon-only{
    opacity:0;max-width:0;padding-left:0;padding-right:0;margin:0;
    pointer-events:none;
  }

  /* ---------- 操作提示 ---------- */
  #hint{
    position:fixed;left:50%;bottom:84px;transform:translateX(-50%);
    font-size:12px;color:rgba(190,205,232,.62);letter-spacing:.4px;
    pointer-events:none;white-space:nowrap;
    transition:opacity .45s ease;
    z-index:5;
  }
  #hint.gone{opacity:0}

  /* ---------- 星球标注 ---------- */
  .poi{position:absolute;top:0;left:0;width:0;height:0;will-change:transform,opacity;opacity:0}
  .poi-dot{
    position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;
    background:#ffe6a8;box-shadow:0 0 8px rgba(255,215,130,.95),0 0 18px rgba(255,190,80,.5);
  }
  .poi-dot::before{
    content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;border-radius:50%;
    transform:translate(-50%,-50%);
    border:1px solid rgba(255,225,160,.32);
    animation:pulse 3.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{transform:translate(-50%,-50%) scale(.35);opacity:.85}
    70%{transform:translate(-50%,-50%) scale(1.5);opacity:0}
    100%{opacity:0}
  }
  .poi-name{
    position:absolute;left:12px;top:-10px;white-space:nowrap;
    font-size:11.5px;letter-spacing:.08em;color:#f7faff;
    text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.95),0 0 20px rgba(0,0,0,.7);
    display:flex;flex-direction:column;gap:2px;
  }
  .poi-name b{font-weight:600;letter-spacing:.1em}
  .poi-name em{font-style:normal;font-size:9.5px;letter-spacing:.08em;color:#c3d5ee;opacity:.9}
  .poi-name.left{left:auto;right:12px;text-align:right;align-items:flex-end}

  /* ---------- 加载 ---------- */
  #loading{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:20px;
    background:radial-gradient(120% 90% at 50% 42%,#0a1526 0%,#03060d 70%);
    z-index:20;transition:opacity .75s ease;
  }
  #loading.done{opacity:0;pointer-events:none}
  .ring{width:52px;height:52px;position:relative}
  .ring::before,.ring::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    border:2px solid transparent;
  }
  .ring::before{border-top-color:var(--accent);border-right-color:rgba(87,182,255,.35);
                animation:spin 1.05s linear infinite}
  .ring::after{inset:9px;border-bottom-color:rgba(140,200,255,.5);
               animation:spin 1.5s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading .txt{font-size:13px;color:var(--ink-dim);letter-spacing:1px}
  #bar{width:190px;height:2px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
  #bar i{display:block;height:100%;width:0%;border-radius:2px;
         background:linear-gradient(90deg,#2b7fd4,#7cc6ff);transition:width .3s ease}
  #err{
    position:fixed;inset:0;display:none;flex-direction:column;gap:12px;
    align-items:center;justify-content:center;padding:32px;text-align:center;
    background:#03060d;z-index:30;font-size:14px;color:#ffb4b4;
  }
  #err code{font-size:12px;color:var(--ink-dim);max-width:640px;
            word-break:break-word;line-height:1.7}

  /* ---------- 移动端 ---------- */
  @media (max-width: 720px){
    #title{left:12px;top:12px;padding:10px 14px}
    #title h1{font-size:15px}
    #title p{display:none}
    #toolbar{
      bottom:calc(env(safe-area-inset-bottom, 0px) + 14px);
      left:8px;right:8px;width:auto;max-width:none;transform:none;
      justify-content:space-between;
      padding:5px;gap:0;
      overflow-x:auto;overflow-y:hidden;
      scrollbar-width:none;
    }
    #toolbar.on{transform:none}
    #toolbar::-webkit-scrollbar{display:none}
    .seg button{padding:6px 7px;font-size:11.5px}
    .btn{padding:8px 6px;font-size:12px}
    .btn .lbl{display:none}
    .btn svg{width:15px;height:15px}
    .sep{height:20px;margin:0}
    #hint{
      bottom:calc(env(safe-area-inset-bottom, 0px) + 66px);
      font-size:11px;letter-spacing:.1em;
      max-width:92vw;overflow:hidden;text-overflow:ellipsis;
    }
    .poi-name{font-size:10px}
    .poi-name em{display:none}
  }
  @media (max-height: 480px){
    #title{padding:8px 12px}
    #title h1{font-size:14px}
    #hint{display:none}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>

<header id="title" class="glass">
  <h1>地月系统</h1>
  <p>点击星球或下方按钮切换视角 · 滚轮缩放</p>
</header>

<div id="hint">地球与月球相距 38.4 万公里，此处的距离已按视觉压缩</div>

<nav id="toolbar" class="glass" data-focus="overview">
  <div class="seg">
    <button id="f-earth" class="active" title="聚焦地球">地球</button>
    <button id="f-moon" title="聚焦月球">月球</button>
  </div>
  <span class="sep"></span>
  <button class="btn" id="b-spin" aria-pressed="true" title="自动旋转">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
    <span class="lbl">自转</span><span class="dot"></span>
  </button>
  <button class="btn moon-only" id="b-mark" aria-pressed="true" title="月面标注">
    <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
    <span class="lbl">标注</span><span class="dot"></span>
  </button>
  <button class="btn" id="b-star" aria-pressed="true" title="星空">
    <svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><circle cx="18" cy="17" r="1.1"/><circle cx="5.5" cy="16.5" r=".9"/></svg>
    <span class="lbl">星空</span><span class="dot"></span>
  </button>
  <button class="btn moon-only" id="b-phase" title="切换月球月相">
    <svg viewBox="0 0 24 24"><path d="M20.2 13.4A8.3 8.3 0 0 1 10.6 3.8a8.5 8.5 0 1 0 9.6 9.6z"/></svg>
    <span class="lbl">月相</span>
  </button>
  <span class="sep"></span>
  <button class="btn" id="b-reset" title="重置视角">
    <svg viewBox="0 0 24 24"><path d="M12 3v3"/><circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 1.4"/></svg>
    <span class="lbl">重置</span>
  </button>
  <button class="btn" id="b-full" title="全屏">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5"/><path d="M20 15v5h-5"/><path d="M15 4h5v5"/><path d="M9 20H4v-5"/></svg>
    <span class="lbl">全屏</span>
  </button>
</nav>

<div id="loading">
  <div class="ring"></div>
  <div class="txt" id="ltxt">正在装配地月系统…</div>
  <div id="bar"><i id="barfill"></i></div>
</div>

<div id="err">
  <div>无法启动 3D 渲染</div>
  <code id="errmsg"></code>
</div>

<script src="three.min.js"></script>
<script src="earth-assets.js"></script>
<script src="moon-assets.js"></script>
<script>
"use strict";
(function () {

/* ══════════════════════════════════════════════════════════════
   0. 工具
   ══════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const PORTRAIT = window.innerWidth / window.innerHeight < 0.8;

function fatal(msg) {
  $("loading").classList.add("done");
  $("errmsg").textContent = msg;
  $("err").style.display = "flex";
  console.error(msg);
}

/* ══════════════════════════════════════════════════════════════
   1. 参数
   ══════════════════════════════════════════════════════════════ */
const R_E = 1;                      // 地球半径
const R_M = 0.2726;                 // 月球 / 地球 半径比（3474.8 / 12742）
const DIST = 7.2;                   // 视觉压缩后的地月距离
const EARTH_POS = new THREE.Vector3(0, 0, 0);
const MOON_POS = new THREE.Vector3(DIST, 0.42, -0.9);

const FOV = 45;
const CAM_NEAR = 0.01, CAM_FAR = 4000;

const VIEW = PORTRAIT ? {
  earth: { radius: 5.4 },
  moon: { radius: 1.95 },
  overview: { radius: 24 }
} : {
  earth: { radius: 3.4 },
  moon: { radius: 1.15 },
  overview: { radius: 13.5 }
};

const R_LIMITS = {
  earth: { min: PORTRAIT ? 2.6 : 1.4, max: 40 },
  moon: { min: PORTRAIT ? 0.85 : 0.5, max: 40 }
};

/* 太阳方位（控制地球昼夜与月球月相） */
const PHASES = [34, 0, 45, 90, 135, 180];
let phaseIdx = 0;

const state = {
  spin: true,
  mark: true,
  star: true,
  focus: "overview",          // overview | earth | moon
  earthRot: -Math.PI / 2,
  moonRot: Math.PI,
  cloudRot: -Math.PI / 2,
  theta: 0.30, phi: 1.33,
  radius: VIEW.overview.radius,
  tRadius: VIEW.overview.radius,
  target: new THREE.Vector3().addVectors(EARTH_POS, MOON_POS).multiplyScalar(0.5),
  tTarget: new THREE.Vector3().addVectors(EARTH_POS, MOON_POS).multiplyScalar(0.5),
  vTheta: 0, vPhi: 0,
  dragging: false,
  lastX: 0, lastY: 0,
  moved: false,
  pinch: 0,
  sunAz: 34 * Math.PI / 180,
  sunEl: 12 * Math.PI / 180,
  ready: false
};

/* 月面标注 */
const POIS = [
  { name: '静海', en: 'Mare Tranquillitatis', lat: 8.5, lon: 31.4 },
  { name: '雨海', en: 'Mare Imbrium', lat: 32.8, lon: -15.9 },
  { name: '风暴洋', en: 'Oceanus Procellarum', lat: 18.4, lon: -57.4 },
  { name: '危海', en: 'Mare Crisium', lat: 17.0, lon: 59.1, side: 'left' },
  { name: '第谷环形山', en: 'Tycho', lat: -43.3, lon: -11.4 },
  { name: '哥白尼环形山', en: 'Copernicus', lat: 9.6, lon: -20.1, side: 'left' },
  { name: '阿波罗 11 号着陆点', en: 'Apollo 11 · Tranquility Base', lat: 0.67, lon: 23.47 },
  { name: '南极-艾特肯盆地', en: 'South Pole–Aitken', lat: -53.0, lon: -169.0, side: 'left' }
];

/* ══════════════════════════════════════════════════════════════
   2. 启动
   ══════════════════════════════════════════════════════════════ */
function boot() {
  const canvas = $("gl");
  if (!window.THREE) { fatal("three.js 未能加载"); return; }
  if (!window.EARTH_ASSETS || !window.MOON_ASSETS) { fatal("星球贴图数据缺失"); return; }

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
  } catch (e) { fatal("当前浏览器或显卡不支持 WebGL。请用较新版本的 Chrome / Edge 打开。"); return; }

  const PR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(PR);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.setClearColor(0x03060d, 1);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.NoToneMapping;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, CAM_NEAR, CAM_FAR);

  /* ---------- 太阳 ---------- */
  // 月球：太阳方位随「月相」按钮变化
  const sunDir = new THREE.Vector3(0, 0, 1);
  function updateSun() {
    const az = state.sunAz, el = state.sunEl;
    sunDir.set(
      Math.cos(el) * Math.sin(az),
      Math.sin(el),
      Math.cos(el) * Math.cos(az)
    ).normalize();
  }
  updateSun();

  // 地球：固定的受光方向（正面受光、略带立体），不随月相按钮变化
  const earthSunDir = (function () {
    const az = 18 * Math.PI / 180, el = 10 * Math.PI / 180;
    return new THREE.Vector3(
      Math.cos(el) * Math.sin(az),
      Math.sin(el),
      Math.cos(el) * Math.cos(az)
    ).normalize();
  })();

  /* ---------- 纹理 ---------- */
  let done = 0;
  const TOTAL = 6;
  const barfill = $("barfill");
  function tickLoad() {
    done++;
    barfill.style.width = Math.round(24 + (done / TOTAL) * 74) + "%";
  }
  function loadTex(url, srgb) {
    return new Promise((resolve, reject) => {
      new THREE.TextureLoader().load(url, (tex) => {
        if (srgb) tex.encoding = THREE.sRGBEncoding;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.generateMipmaps = true;
        tickLoad();
        resolve(tex);
      }, undefined, reject);
    });
  }

  Promise.all([
    loadTex(window.EARTH_ASSETS.day, true),
    loadTex(window.EARTH_ASSETS.night, true),
    loadTex(window.EARTH_ASSETS.cloud, false),
    loadTex(window.EARTH_ASSETS.spec, false),
    loadTex(window.MOON_ASSETS.color, true),
    loadTex(window.MOON_ASSETS.dem, false)
  ]).then((t) => {
    build(t[0], t[1], t[2], t[3], t[4], t[5]);
    state.ready = true;
    $("ltxt").textContent = "完成";
    barfill.style.width = "100%";
    setTimeout(() => {
      $("loading").classList.add("done");
      $("title").classList.add("on");
      $("toolbar").classList.add("on");
      if (PORTRAIT) focusOn("earth", true);
      else setTimeout(() => focusOn("earth"), 1400);
    }, 150);
    buildLabels();
    lastT = performance.now();
    requestAnimationFrame(frame);
  }).catch((e) => {
    fatal("贴图加载失败：" + (e && e.message ? e.message : e));
  });

  /* ══════════ 星球构建 ══════════ */
  let earth, cloud, moon, moonMat, orbitLine = null;
  let earthGroup, moonGroup;

  const vsMain = [
    "varying vec3 vN;",
    "varying vec3 vW;",
    "varying vec2 vUv;",
    "void main(){",
    "  vec4 wp = modelMatrix * vec4(position, 1.0);",
    "  vW = wp.xyz;",
    "  vN = normalize(mat3(modelMatrix) * normal);",
    "  vUv = uv;",
    "  gl_Position = projectionMatrix * viewMatrix * wp;",
    "}"
  ].join("\n");

  const fsEarth = [
    "varying vec3 vN;",
    "varying vec3 vW;",
    "varying vec2 vUv;",
    "uniform sampler2D uDay, uNight, uSpec, uCloud;",
    "uniform vec3 uSun;",
    "uniform float uNightMix, uCloudShadow, uCloudShift;",
    "void main(){",
    "  vec3 N = normalize(vN);",
    "  vec3 V = normalize(cameraPosition - vW);",
    "  vec3 L = normalize(uSun);",
    "  float ndl = dot(N, L);",
    "  float dayAmt = smoothstep(-0.11, 0.24, ndl);",
    "  vec3 dayC = texture2D(uDay, vUv).rgb;",
    "  vec3 nightC = texture2D(uNight, vUv).rgb;",
    "  float ocean = texture2D(uSpec, vUv).r;",
    "  float diff = max(ndl, 0.0);",
    "  vec3 lit = dayC * (0.045 + 0.955 * pow(diff, 0.82));",
    "  float cl = texture2D(uCloud, vec2(vUv.x + uCloudShift, vUv.y)).r;",
    "  lit *= 1.0 - cl * uCloudShadow * dayAmt;",
    "  vec3 H = normalize(L + V);",
    "  float nh = max(dot(N, H), 0.0);",
    "  float glint = pow(nh, 900.0) * 1.05 + pow(nh, 70.0) * 0.055;",
    "  lit += vec3(1.0, 0.95, 0.84) * glint * ocean * smoothstep(0.0, 0.09, ndl);",
    "  vec3 night = vec3(0.010, 0.017, 0.038) + nightC.r * vec3(1.0, 0.86, 0.62) * 2.05 * uNightMix;",
    "  vec3 col = mix(night, lit, dayAmt);",
    "  gl_FragColor = vec4(col, 1.0);",
    "}"
  ].join("\n");

  const fsCloud = [
    "varying vec3 vN;",
    "varying vec3 vW;",
    "varying vec2 vUv;",
    "uniform sampler2D uCloud;",
    "uniform vec3 uSun;",
    "uniform float uOpacity;",
    "void main(){",
    "  vec3 N = normalize(vN);",
    "  vec3 L = normalize(uSun);",
    "  float d = texture2D(uCloud, vUv).r;",
    "  if (d < 0.004) discard;",
    "  float ndl = dot(N, L);",
    "  float lit = smoothstep(-0.28, 0.34, ndl);",
    "  vec3 c = mix(vec3(0.028, 0.042, 0.075), vec3(1.0), lit);",
    "  float term = clamp(1.0 - abs(ndl) * 3.4, 0.0, 1.0);",
    "  c = mix(c, vec3(1.0, 0.70, 0.48), term * 0.42);",
    "  gl_FragColor = vec4(c, d * uOpacity);",
    "}"
  ].join("\n");

  const earthUniforms = {
    uDay: { value: null }, uNight: { value: null },
    uSpec: { value: null }, uCloud: { value: null },
    uSun: { value: earthSunDir },
    uNightMix: { value: 1.0 },
    uCloudShadow: { value: 0.32 },
    uCloudShift: { value: 0.0 }
  };

  function build(dayTex, nightTex, cloudTex, specTex, moonTex, demTex) {
    /* ---- 地球 ---- */
    earthGroup = new THREE.Group();
    earthGroup.position.copy(EARTH_POS);
    scene.add(earthGroup);

    earthUniforms.uDay.value = dayTex;
    earthUniforms.uNight.value = nightTex;
    earthUniforms.uSpec.value = specTex;
    earthUniforms.uCloud.value = cloudTex;

    const earthMat = new THREE.ShaderMaterial({
      uniforms: earthUniforms,
      vertexShader: vsMain,
      fragmentShader: fsEarth
    });
    earth = new THREE.Mesh(new THREE.SphereGeometry(R_E, 160, 80), earthMat);
    earth.rotation.y = state.earthRot;
    earthGroup.add(earth);

    /* ---- 云层 ---- */
    const cloudMat = new THREE.ShaderMaterial({
      uniforms: { uCloud: { value: cloudTex }, uSun: { value: earthSunDir }, uOpacity: { value: 0.92 } },
      vertexShader: vsMain,
      fragmentShader: fsCloud,
      transparent: true,
      depthWrite: false
    });
    cloud = new THREE.Mesh(new THREE.SphereGeometry(R_E * 1.006, 128, 64), cloudMat);
    cloud.rotation.y = state.cloudRot;
    earthGroup.add(cloud);

    /* ---- 月球 ---- */
    moonGroup = new THREE.Group();
    moonGroup.position.copy(MOON_POS);
    scene.add(moonGroup);

    moonMat = new THREE.MeshStandardMaterial({
      map: moonTex,
      bumpMap: demTex,
      bumpScale: 0.045,
      roughness: 0.95,
      metalness: 0.0
    });
    moon = new THREE.Mesh(new THREE.SphereGeometry(R_M, 256, 128), moonMat);
    moon.rotation.y = state.moonRot;
    moonGroup.add(moon);

    /* ---- 光照 ---- */
    // 太阳：两球共用的平行光
    const sunLight = new THREE.DirectionalLight(0xfffdf8, 1.0);
    scene.add(sunLight);
    scene.add(sunLight.target);
    // 地照：地球反射到月球的冷光
    const earthShine = new THREE.DirectionalLight(0x7a8ec8, 0.12);
    scene.add(earthShine);
    scene.add(earthShine.target);

    scene.add(new THREE.AmbientLight(0x1c273d, 0.10));

    function placeLights() {
      sunLight.position.copy(sunDir).multiplyScalar(30);
      sunLight.target.position.set(0, 0, 0);
      // 地照从地球方向照向月球
      const toEarth = EARTH_POS.clone().sub(MOON_POS).normalize();
      earthShine.position.copy(MOON_POS).addScaledVector(toEarth, 12);
      earthShine.target.position.copy(MOON_POS);
    }
    placeLights();
    window.__placeLights = placeLights;

    /* ---- 地月连线（示意两者距离） ---- */
    const lineGeo = new THREE.BufferGeometry().setFromPoints([EARTH_POS.clone(), MOON_POS.clone()]);
    orbitLine = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({
      color: 0x8fb4e8, transparent: true, opacity: 0.15, depthWrite: false
    }));
    scene.add(orbitLine);

    makeStars();
  }

  /* ══════════ 星空 ══════════ */
  let starMat = null, stars = null, galaxy = null;

  function makeStars() {
    function geo(count, opts) {
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      const size = new Float32Array(count);
      const phase = new Float32Array(count);
      const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(1.02, 0.5, 0.2));
      const v = new THREE.Vector3();

      for (let i = 0; i < count; i++) {
        if (opts.band) {
          const a = Math.random() * Math.PI * 2;
          const g = (Math.random() + Math.random() + Math.random() - 1.5) * 0.22;
          v.set(Math.cos(a), g, Math.sin(a)).normalize().applyQuaternion(q);
        } else {
          const u = Math.random() * 2 - 1;
          const th = Math.random() * Math.PI * 2;
          const s = Math.sqrt(1 - u * u);
          v.set(s * Math.cos(th), u, s * Math.sin(th));
        }
        const r = opts.rMin + Math.random() * (opts.rMax - opts.rMin);
        pos[i * 3] = v.x * r; pos[i * 3 + 1] = v.y * r; pos[i * 3 + 2] = v.z * r;

        const t = Math.random();
        let cr, cg, cb;
        if (t < 0.14) { cr = 1.0; cg = 0.86; cb = 0.70; }
        else if (t < 0.34) { cr = 0.76; cg = 0.86; cb = 1.0; }
        else { cr = 1.0; cg = 0.98; cb = 0.95; }
        const lum = opts.lum * (0.45 + Math.random() * 0.75);
        col[i * 3] = cr * lum; col[i * 3 + 1] = cg * lum; col[i * 3 + 2] = cb * lum;

        size[i] = opts.size * (0.45 + Math.pow(Math.random(), 2.6) * 1.9);
        phase[i] = Math.random() * Math.PI * 2;
      }
      const g2 = new THREE.BufferGeometry();
      g2.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      g2.setAttribute("aColor", new THREE.BufferAttribute(col, 3));
      g2.setAttribute("aSize", new THREE.BufferAttribute(size, 1));
      g2.setAttribute("aPhase", new THREE.BufferAttribute(phase, 1));
      return g2;
    }

    starMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uPixelRatio: { value: PR } },
      vertexShader: [
        "attribute float aSize;",
        "attribute float aPhase;",
        "attribute vec3 aColor;",
        "uniform float uTime;",
        "uniform float uPixelRatio;",
        "varying vec3 vColor;",
        "varying float vTwinkle;",
        "void main(){",
        "  vColor = aColor;",
        "  vec4 mv = modelViewMatrix * vec4(position, 1.0);",
        "  gl_PointSize = aSize * uPixelRatio * (330.0 / max(1.0, -mv.z));",
        "  gl_Position = projectionMatrix * mv;",
        "  vTwinkle = 0.74 + 0.26 * sin(uTime * 0.9 + aPhase);",
        "}"
      ].join("\n"),
      fragmentShader: [
        "varying vec3 vColor;",
        "varying float vTwinkle;",
        "void main(){",
        "  vec2 d = gl_PointCoord - 0.5;",
        "  float r = length(d);",
        "  float a = smoothstep(0.5, 0.02, r);",
        "  a = pow(a, 1.8);",
        "  gl_FragColor = vec4(vColor * vTwinkle, a);",
        "}"
      ].join("\n"),
      transparent: true, depthWrite: false, depthTest: true,
      blending: THREE.AdditiveBlending
    });

    stars = new THREE.Points(geo(3200, { rMin: 200, rMax: 500, lum: 1.0, size: 1.05 }), starMat);
    stars.frustumCulled = false;
    scene.add(stars);

    galaxy = new THREE.Points(geo(4400, { band: true, rMin: 260, rMax: 600, lum: 0.58, size: 0.8 }), starMat);
    galaxy.frustumCulled = false;
    scene.add(galaxy);
  }

  /* ══════════ 标注 ══════════ */
  const labelLayer = $("labels");
  const poiItems = [];

  function latLonToVec(lat, lon, r) {
    const la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
    return new THREE.Vector3(
      Math.cos(la) * Math.cos(lo),
      Math.sin(la),
      -Math.cos(la) * Math.sin(lo)
    ).multiplyScalar(r || 1);
  }

  function buildLabels() {
    POIS.forEach((p) => {
      const el = document.createElement("div");
      el.className = "poi";
      const dot = document.createElement("span");
      dot.className = "poi-dot";
      const nm = document.createElement("span");
      nm.className = "poi-name" + (p.side === "left" ? " left" : "");
      const b = document.createElement("b");
      b.textContent = p.name;
      const em = document.createElement("em");
      em.textContent = p.en;
      nm.appendChild(b); nm.appendChild(em);
      el.appendChild(dot); el.appendChild(nm);
      labelLayer.appendChild(el);
      poiItems.push({
        el, nameEl: nm,
        vec: latLonToVec(p.lat, p.lon, R_M * 1.006),
        baseSide: p.side === "left" ? "left" : "right",
        side: p.side === "left" ? "left" : "right"
      });
    });
  }

  const _v = new THREE.Vector3();
  const _n = new THREE.Vector3();
  const _c = new THREE.Vector3();

  function updateLabels() {
    if (!poiItems.length) return;
    const camToMoon = camera.position.distanceTo(MOON_POS);
    const show = state.mark && camToMoon < 4.2;
    if (!show) {
      poiItems.forEach((it) => { it.el.style.opacity = "0"; });
      return;
    }
    moon.updateMatrixWorld();
    const w = window.innerWidth, h = window.innerHeight;
    const placed = [];

    for (let i = 0; i < poiItems.length; i++) {
      const it = poiItems[i];
      _v.copy(it.vec);
      moon.localToWorld(_v);

      _n.copy(_v).sub(MOON_POS).normalize();
      _c.copy(camera.position).sub(_v).normalize();
      const facing = _n.dot(_c);
      if (facing < 0.03) { it.el.style.opacity = "0"; continue; }

      const ndc = _v.clone().project(camera);
      const x = (ndc.x * 0.5 + 0.5) * w;
      const y = (-ndc.y * 0.5 + 0.5) * h;

      let side = it.baseSide;
      if (x > w - 118) side = "left";
      else if (x < 118) side = "right";
      if (side !== it.side) {
        it.side = side;
        it.nameEl.classList.toggle("left", side === "left");
      }

      // 标签文字避让：与已放置的标签太近就向下错开
      let ty = y;
      for (let j = 0; j < placed.length; j++) {
        const q = placed[j];
        if (Math.abs(x - q.x) < 104 && Math.abs(ty - q.y) < 19) ty = q.y + 19;
      }
      ty = clamp(ty, 20, h - 96);
      placed.push({ x: x, y: ty });
      it.nameEl.style.marginTop = (ty - y).toFixed(1) + "px";

      let alpha = clamp((facing - 0.03) / 0.20, 0, 1);
      alpha = alpha * alpha * (3 - 2 * alpha);
      alpha *= clamp((4.2 - camToMoon) / 1.2, 0, 1);

      it.el.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px,0)";
      it.el.style.opacity = alpha.toFixed(3);
    }
  }

  /* ══════════ 焦点切换 ══════════ */
  const segEarth = $("f-earth"), segMoon = $("f-moon");

  function updateSeg() {
    segEarth.classList.toggle("active", state.focus === "earth");
    segMoon.classList.toggle("active", state.focus === "moon");
    $("toolbar").dataset.focus = state.focus;
  }

  function focusOn(which, instant) {
    state.focus = which;
    if (which === "earth") {
      state.tTarget.copy(EARTH_POS);
      state.tRadius = VIEW.earth.radius;
    } else if (which === "moon") {
      state.tTarget.copy(MOON_POS);
      state.tRadius = VIEW.moon.radius;
    } else {
      state.tTarget.addVectors(EARTH_POS, MOON_POS).multiplyScalar(0.5);
      state.tRadius = VIEW.overview.radius;
    }
    if (instant) { state.target.copy(state.tTarget); state.radius = state.tRadius; }
    updateSeg();
  }

  segEarth.addEventListener("click", () => { focusOn("earth"); hideHint(); });
  segMoon.addEventListener("click", () => { focusOn("moon"); hideHint(); });

  /* ══════════ 交互 ══════════ */
  const SENS = 0.0052;

  function down(x, y) {
    state.dragging = true; state.moved = false;
    state.lastX = x; state.lastY = y;
    state.vTheta = state.vPhi = 0;
    canvas.classList.add("dragging");
    hideHint();
  }
  function move(x, y) {
    if (!state.dragging) return;
    const dx = x - state.lastX, dy = y - state.lastY;
    state.lastX = x; state.lastY = y;
    if (Math.abs(dx) + Math.abs(dy) > 1) state.moved = true;
    state.vTheta = -dx * SENS * 0.55;
    state.vPhi = -dy * SENS * 0.55;
    state.theta -= dx * SENS;
    state.phi = clamp(state.phi - dy * SENS, 0.08, Math.PI - 0.08);
  }
  function up() {
    state.dragging = false;
    canvas.classList.remove("dragging");
  }

  const active = new Map();

  function onDown(e) {
    active.set(e.pointerId, [e.clientX, e.clientY]);
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
    if (active.size === 1) down(e.clientX, e.clientY);
    else { state.dragging = false; canvas.classList.remove("dragging"); state.pinch = 0; }
  }

  function onMove(e) {
    if (!active.has(e.pointerId)) return;
    active.set(e.pointerId, [e.clientX, e.clientY]);
    if (active.size === 1) {
      move(e.clientX, e.clientY);
    } else if (active.size >= 2) {
      const [a, b] = [...active.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (state.pinch > 0 && d > 0) {
        const lim = R_LIMITS[state.focus === "moon" ? "moon" : "earth"];
        state.tRadius = clamp(state.tRadius * (state.pinch / d), lim.min, lim.max);
      }
      state.pinch = d;
      hideHint();
    }
  }

  function onUp(e) {
    active.delete(e.pointerId);
    if (active.size === 0) { state.pinch = 0; up(); }
    else if (active.size === 1) {
      state.pinch = 0;
      const [x, y] = [...active.values()][0];
      down(x, y);
    }
  }

  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onUp);
  canvas.addEventListener("lostpointercapture", onUp);

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * 100 : e.deltaY;
    const lim = R_LIMITS[state.focus === "moon" ? "moon" : "earth"];
    state.tRadius = clamp(state.tRadius * Math.exp(clamp(d, -160, 160) * 0.0013), lim.min, lim.max);
    hideHint();
  }, { passive: false });

  /* 点击星球切换 */
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let downAt = 0;

  canvas.addEventListener("pointerdown", () => { downAt = performance.now(); });
  canvas.addEventListener("click", (e) => {
    if (performance.now() - downAt > 320) return;   // 拖动结束的误触
    if (state.moved) return;
    if (!earth || !moon) return;
    const rect = canvas.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects([earth, cloud, moon], false);
    if (!hits.length) return;
    const obj = hits[0].object;
    if (obj === moon) { focusOn("moon"); flashHint("已聚焦月球 · 点击地球可返回"); }
    else { focusOn("earth"); flashHint("已聚焦地球 · 点击月球可飞过去"); }
  });

  canvas.addEventListener("dblclick", () => resetView());

  function resetView() {
    focusOn("overview");
    state.theta = 0.30; state.phi = 1.33;
    state.vTheta = state.vPhi = 0;
    hideHint();
  }

  /* 键盘 */
  window.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    const k = e.key.toLowerCase();
    if (e.key === " ") { e.preventDefault(); $("b-spin").click(); }
    else if (k === "r") resetView();
    else if (k === "f") $("b-full").click();
    else if (k === "m") $("b-mark").click();
    else if (k === "p") $("b-phase").click();
    else if (k === "e") focusOn("earth");
    else if (k === "l") focusOn("moon");
    else if (e.key === "ArrowLeft") state.theta += 0.09;
    else if (e.key === "ArrowRight") state.theta -= 0.09;
    else if (e.key === "ArrowUp") state.phi = clamp(state.phi - 0.07, 0.08, Math.PI - 0.08);
    else if (e.key === "ArrowDown") state.phi = clamp(state.phi + 0.07, 0.08, Math.PI - 0.08);
    else if (e.key === "+" || e.key === "=") {
      const lim = R_LIMITS[state.focus === "moon" ? "moon" : "earth"];
      state.tRadius = clamp(state.tRadius * 0.86, lim.min, lim.max);
    } else if (e.key === "-" || e.key === "_") {
      const lim = R_LIMITS[state.focus === "moon" ? "moon" : "earth"];
      state.tRadius = clamp(state.tRadius / 0.86, lim.min, lim.max);
    }
  });

  /* ══════════ 工具栏 ══════════ */
  function toggle(btn, key, onChange) {
    btn.addEventListener("click", () => {
      state[key] = !state[key];
      btn.setAttribute("aria-pressed", String(state[key]));
      if (onChange) onChange(state[key]);
      hideHint();
    });
  }

  toggle($("b-spin"), "spin");
  toggle($("b-mark"), "mark", (on) => {
    if (!on) poiItems.forEach((it) => { it.el.style.opacity = "0"; });
  });
  toggle($("b-star"), "star", (on) => {
    if (stars) stars.visible = on;
    if (galaxy) galaxy.visible = on;
  });

  function phaseName(deg) {
    if (deg <= 5) return "满月";
    if (deg < 85) return "凸月";
    if (deg <= 95) return "弦月";
    if (deg < 175) return "残月";
    return "新月";
  }

  $("b-phase").addEventListener("click", () => {
    phaseIdx = (phaseIdx + 1) % PHASES.length;
    const deg = PHASES[phaseIdx];
    state.sunAz = deg * Math.PI / 180;
    updateSun();
    if (window.__placeLights) window.__placeLights();
    flashHint("月球月相 " + deg + "° · " + phaseName(deg));
  });

  $("b-reset").addEventListener("click", resetView);

  $("b-full").addEventListener("click", () => {
    if (!document.fullscreenElement) {
      (document.documentElement.requestFullscreen || function () {}).call(document.documentElement).catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });
  document.addEventListener("fullscreenchange", () => {
    $("b-full").setAttribute("aria-pressed", String(!!document.fullscreenElement));
    setTimeout(resize, 60);
  });

  /* 提示 */
  const hintEl = $("hint");
  let hintTimer = setTimeout(() => hintEl.classList.add("gone"), 6000);
  function hideHint() { clearTimeout(hintTimer); hintEl.classList.add("gone"); }
  function flashHint(text) {
    clearTimeout(hintTimer);
    hintEl.textContent = text;
    hintEl.classList.remove("gone");
    hintTimer = setTimeout(() => hintEl.classList.add("gone"), 1900);
  }

  /* ══════════ 主循环 ══════════ */
  let lastT = 0, tAcc = 0, spinGain = 0, running = true;

  function frame(now) {
    if (!running) return;
    requestAnimationFrame(frame);

    let dt = (now - lastT) / 1000;
    lastT = now;
    if (!(dt > 0)) dt = 0.016;
    if (dt > 0.1) dt = 0.1;
    tAcc += dt;

    /* 相机阻尼 + 惯性 */
    if (!state.dragging) {
      if (Math.abs(state.vTheta) > 1e-5 || Math.abs(state.vPhi) > 1e-5) {
        state.theta += state.vTheta;
        state.phi = clamp(state.phi + state.vPhi, 0.08, Math.PI - 0.08);
        state.vTheta *= Math.pow(0.94, dt * 60);
        state.vPhi *= Math.pow(0.94, dt * 60);
        spinGain = 0;
      } else {
        state.vTheta = state.vPhi = 0;
      }
    }

    const k = 1 - Math.pow(0.0016, dt);
    state.radius = lerp(state.radius, state.tRadius, k);
    state.target.lerp(state.tTarget, k);

    /* 自转 */
    const wantSpin = state.spin && !state.dragging && state.vTheta === 0 && state.vPhi === 0;
    spinGain += ((wantSpin ? 1 : 0) - spinGain) * (1 - Math.pow(0.06, dt));
    if (spinGain > 0.001) {
      state.earthRot += dt * 0.055 * spinGain;
      state.cloudRot += dt * 0.062 * spinGain;
      state.moonRot += dt * 0.012 * spinGain;
    }
    state.earthRot %= Math.PI * 2;
    state.cloudRot %= Math.PI * 2;
    state.moonRot %= Math.PI * 2;

    if (earth) earth.rotation.y = state.earthRot;
    if (cloud) cloud.rotation.y = state.cloudRot;
    if (moon) moon.rotation.y = state.moonRot;

    /* 云影偏移（uv 单位） */
    let shift = (state.cloudRot - state.earthRot) / (Math.PI * 2);
    shift -= Math.round(shift);
    earthUniforms.uCloudShift.value = shift;

    /* 相机 */
    const sp = Math.sin(state.phi), cp = Math.cos(state.phi);
    camera.position.set(
      state.target.x + state.radius * sp * Math.sin(state.theta),
      state.target.y + state.radius * cp,
      state.target.z + state.radius * sp * Math.cos(state.theta)
    );
    camera.lookAt(state.target);

    if (orbitLine) {
      orbitLine.material.opacity = clamp((state.radius - 4.5) / 6, 0, 1) * 0.18;
    }

    if (starMat) starMat.uniforms.uTime.value = tAcc;

    if (state.ready) updateLabels();
    renderer.render(scene, camera);
  }

  /* 尺寸 */
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 120));

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { running = false; }
    else if (!running) { running = true; lastT = performance.now(); requestAnimationFrame(frame); }
  });

  setTimeout(() => { barfill.style.width = "18%"; }, 80);

  window.__em = { state, camera, scene, focusOn, VIEW, R_LIMITS, MOON_POS, EARTH_POS };
}

boot();
})();
</script>
</body>
</html>
